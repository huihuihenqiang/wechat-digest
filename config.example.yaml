# Copy this file to config.yaml, then change group names and receiver.

wechat:
  groups:
    - "需要总结的微信群名"
  recipient: "文件传输助手"
  poll_interval_seconds: 60
  message_fetch_limit: 80
  message_chunk_size: 1800

collection:
  mode: "backfill"
  backfill_until: "previous_day_start"
  backfill_fetch_limit: 500
  backfill_max_scrolls: 20
  scroll_pause_seconds: 0.02

digest:
  time: "22:00"
  timezone: "Asia/Hong_Kong"
  retention_days: 30

storage:
  path: "data/wechat_digest.sqlite3"

llm:
  base_url: "${OPENAI_BASE_URL}"
  api_key: "${OPENAI_API_KEY}"
  model: "${OPENAI_MODEL}"
  timeout_seconds: 60
  max_input_messages: 500
  temperature: 0.2

openclaw:
  enabled: true
  channel: "openclaw-weixin"
  # Legacy fallback for `wechat-digest assistant`.
  # The recommended mode is OpenClaw Gateway + openclaw-plugin/wechat-digest.
  transport: "weixin-direct"
  account_id: ""
  base_dir: ""
  sync_path: "data/openclaw-weixin-direct-sync.json"
  command: "openclaw"
  args:
    - "mcp"
    - "serve"
  poll_timeout_seconds: 30
  request_timeout_seconds: 90
